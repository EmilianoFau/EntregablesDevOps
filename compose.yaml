services:
  app:
    build:
      context: .
      target: runtime
    environment:
      DATA_FILE: /app/data/entries.json
      APP_VERSION: v2
      DEPLOYMENT_COLOR: standalone
      JOURNAL_TIMEZONE: America/Montevideo
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  test:
    profiles: ["test"]
    build:
      context: .
      target: test
