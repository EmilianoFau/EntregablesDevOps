services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-journal}
      POSTGRES_USER: ${POSTGRES_USER:-journal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-journal_dev_password}
    volumes:
      - journal_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-journal} -d ${POSTGRES_DB:-journal}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://journal:journal_dev_password@db:5432/journal}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://journal:journal_dev_password@db:5432/journal}
      APP_VERSION: ${APP_VERSION:-v2}
      DEPLOYMENT_COLOR: ${DEPLOYMENT_COLOR:-local}
      JOURNAL_TIMEZONE: ${JOURNAL_TIMEZONE:-America/Montevideo}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      DATABASE_URL: "sqlite+pysqlite:///:memory:"

volumes:
  journal_data:
