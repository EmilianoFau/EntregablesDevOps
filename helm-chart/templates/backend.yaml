{{- $name := printf "%s-backend" (include "journal.fullname" .) -}}
{{- $b := .Values.backend -}}
# ConfigMap: configuración del backend separada de la imagen.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "journal.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
data:
  {{- range $key, $value := $b.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
---
# Deployment: la API FastAPI.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "journal.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ $b.replicas }}
  # Recreate: con una sola réplica y datos por pod, no conviene tener dos a la vez.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "journal.selectorLabels" (list . "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "journal.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
      annotations:
        # Si cambia el ConfigMap, cambia el hash y Kubernetes reinicia los pods.
        checksum/config: {{ toJson $b.config | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        runAsUser: {{ $b.runAsUser }}
        runAsGroup: {{ $b.runAsGroup }}
        fsGroup: {{ $b.runAsGroup }}
      initContainers:
        # La raíz es de solo lectura: se copian los datos de ejemplo de la imagen
        # a un volumen escribible antes de arrancar la API.
        - name: seed-data
          image: {{ include "journal.image" $b.image }}
          imagePullPolicy: {{ $b.image.pullPolicy }}
          command: ["cp", "/app/data/entries.json", "/seed/entries.json"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml $b.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /seed
      containers:
        - name: backend
          image: {{ include "journal.image" $b.image }}
          imagePullPolicy: {{ $b.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $b.port }}
          envFrom:
            - configMapRef:
                name: {{ $name }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml $b.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
# Service: nombre DNS estable para llegar al backend desde nginx y Prometheus.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "journal.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    {{- include "journal.selectorLabels" (list . "backend") | nindent 4 }}
  ports:
    - name: http
      port: {{ $b.port }}
      targetPort: http
