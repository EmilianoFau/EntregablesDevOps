{{- $name := printf "%s-frontend" (include "journal.fullname" .) -}}
{{- $backend := printf "%s-backend" (include "journal.fullname" .) -}}
{{- $f := .Values.frontend -}}
# ConfigMap: nginx.conf con el nombre del Service del backend de este release.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "journal.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  nginx.conf: |
    {{- .Files.Get "files/nginx.conf" | replace "server backend:8000;" (printf "server %s:%v;" $backend .Values.backend.port) | replace "listen 8080;" (printf "listen %v;" $f.port) | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "journal.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ $f.replicas }}
  selector:
    matchLabels:
      {{- include "journal.selectorLabels" (list . "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "journal.labels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
      annotations:
        checksum/config: {{ .Files.Get "files/nginx.conf" | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        runAsUser: {{ $f.runAsUser }}
        runAsGroup: {{ $f.runAsGroup }}
      containers:
        - name: frontend
          image: {{ include "journal.image" $f.image }}
          imagePullPolicy: {{ $f.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $f.port }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml $f.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ $name }}
        - name: tmp
          emptyDir: {}
---
# Service: puerta de entrada de la app (lo usan el Ingress y el port-forward).
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "journal.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "journal.selectorLabels" (list . "frontend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
