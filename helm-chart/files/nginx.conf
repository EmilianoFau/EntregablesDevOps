# nginx del frontend: sirve el HTML y reenvía /api al backend.
# Corre sin root (UID 101) y con la raíz de solo lectura: todo lo que nginx
# necesita escribir (pid y temporales) va a /tmp, que es un volumen emptyDir.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # El backend se resuelve por nombre: "backend" en Docker Compose.
    # En Kubernetes el Helm chart monta otra versión de este archivo con el
    # nombre del Service del backend.
    upstream backend {
        server backend:8000;
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;

        # Sirve index.html.gz (precomprimido en el build) si el navegador acepta gzip.
        gzip_static on;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            try_files $uri /index.html;
        }
    }
}
