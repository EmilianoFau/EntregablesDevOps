apiVersion: batch/v1
kind: Job
metadata:
  name: journal-migrate
  namespace: journal
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app: journal-migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: journal:v2
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: journal-secret

