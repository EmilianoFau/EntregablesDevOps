# Política 2: todo contenedor debe declarar requests y limits de CPU y memoria.
# Sin límites, un pod puede consumir todo el nodo (DoS) y el scheduler no
# puede repartir la carga.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-requests-limits
  annotations:
    policies.kyverno.io/title: Exigir requests y limits
    policies.kyverno.io/severity: medium
spec:
  background: true
  rules:
    - name: validate-resources
      match:
        any:
          - resources:
              kinds: ["Pod"]
      exclude:
        any:
          - resources:
              namespaces: ["kube-system", "kyverno", "falco"]
      validate:
        failureAction: Enforce
        message: "Todos los contenedores deben definir resources.requests y resources.limits de cpu y memory."
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"
            =(initContainers):
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"
