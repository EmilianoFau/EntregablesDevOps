# Política 1: prohibir imágenes sin etiqueta o con la etiqueta "latest".
# "latest" no identifica una versión concreta: impide saber qué se está
# ejecutando y rompe la reproducibilidad y el rollback.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Prohibir la etiqueta latest
    policies.kyverno.io/severity: medium
spec:
  # Deny = rechaza el recurso (equivale al Enforce de las ClusterPolicy viejas).
  validationActions: [Deny]
  # Kyverno genera la misma regla para Deployments, Jobs, etc. (autogen), así
  # un Deployment que no cumple se rechaza de entrada.
  autogen:
    podControllers:
      controllers: [deployments, replicasets, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    # Los namespaces del sistema y de las herramientas quedan afuera.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
            - kyverno
            - falco
            - monitoring
            - ingress-nginx
  variables:
    - name: containers
      expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([]) + object.spec.?ephemeralContainers.orValue([])
    - name: tags
      expression: >-
        variables.containers.map(c, c.image.split('/')[size(c.image.split('/')) - 1])
  validations:
    - expression: >-
        variables.tags.all(t, t.contains(':') || t.contains('@'))
      message: "Toda imagen necesita una etiqueta explícita (ej. journal-backend:3-a1b2c3d)."
    - expression: >-
        variables.tags.all(t, !t.endsWith(':latest'))
      message: "No se permite la etiqueta 'latest': usá una versión fija."
