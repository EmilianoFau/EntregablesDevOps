# Política 3: impedir contenedores que se ejecuten como root.
# Exige runAsNonRoot: true (a nivel pod o en cada contenedor) y prohíbe
# runAsUser: 0. Si alguien escapa del contenedor, no lo hace como root.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-run-as-non-root
  annotations:
    policies.kyverno.io/title: Impedir contenedores root
    policies.kyverno.io/severity: high
spec:
  # Deny = rechaza el recurso (equivale al Enforce de las ClusterPolicy viejas).
  validationActions: [Deny]
  # Kyverno genera la misma regla para Deployments, Jobs, etc. (autogen), así
  # un Deployment que no cumple se rechaza de entrada.
  autogen:
    podControllers:
      controllers: [deployments, replicasets, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    # Los namespaces del sistema y de las herramientas quedan afuera.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
            - kyverno
            - falco
            - monitoring
            - ingress-nginx
  variables:
    - name: containers
      expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([]) + object.spec.?ephemeralContainers.orValue([])
    - name: podNonRoot
      expression: >-
        object.spec.?securityContext.?runAsNonRoot.orValue(false)
  validations:
    - expression: >-
        variables.containers.all(c, c.?securityContext.?runAsNonRoot.orValue(variables.podNonRoot) == true)
      message: "Se requiere securityContext.runAsNonRoot: true en el pod o en todos sus contenedores."
    - expression: >-
        object.spec.?securityContext.?runAsUser.orValue(1) != 0 && variables.containers.all(c, c.?securityContext.?runAsUser.orValue(1) != 0)
      message: "runAsUser: 0 (root) no está permitido."
