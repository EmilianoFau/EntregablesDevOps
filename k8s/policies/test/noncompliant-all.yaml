# Manifiesto NO conforme a propósito, para probar las políticas de Kyverno.
# Viola las cuatro: etiqueta latest, sin resources, ejecución como root y sin
# allowPrivilegeEscalation: false.
# Debe ser RECHAZADO por el admission controller:
#   kubectl apply -f k8s/policies/test/noncompliant-all.yaml
apiVersion: v1
kind: Pod
metadata:
  name: noncompliant
  namespace: journal
  labels:
    app: noncompliant
spec:
  securityContext:
    runAsUser: 0
  containers:
    - name: nginx
      image: nginx:latest
