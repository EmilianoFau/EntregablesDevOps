# Viola SOLO la política 3 (require-run-as-non-root): corre como UID 0.
apiVersion: v1
kind: Pod
metadata:
  name: bad-root
  namespace: journal
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsUser: 0
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: app
      image: nginxinc/nginx-unprivileged:1.30.6-alpine3.24
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 50m, memory: 32Mi }
