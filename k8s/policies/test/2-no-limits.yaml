# Viola SOLO la política 2 (require-requests-limits): no declara resources.
apiVersion: v1
kind: Pod
metadata:
  name: bad-no-limits
  namespace: journal
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: app
      image: nginxinc/nginx-unprivileged:1.30.6-alpine3.24
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
