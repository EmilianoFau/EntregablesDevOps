# Política 4: prohibir la escalada de privilegios.
# Aunque el contenedor arranque sin root, un binario con setuid (como sudo o
# passwd) podría darle más permisos que su proceso padre. Con
# allowPrivilegeEscalation: false el kernel lo impide (flag no_new_privs).
# Además se rechazan los contenedores "privileged", que tienen acceso total al nodo.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-privilege-escalation
  annotations:
    policies.kyverno.io/title: Prohibir la escalada de privilegios
    policies.kyverno.io/severity: high
spec:
  # Deny = rechaza el recurso (equivale al Enforce de las ClusterPolicy viejas).
  validationActions: [Deny]
  # Kyverno genera la misma regla para Deployments, Jobs, etc. (autogen), así
  # un Deployment que no cumple se rechaza de entrada.
  autogen:
    podControllers:
      controllers: [deployments, replicasets, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    # Los namespaces del sistema y de las herramientas quedan afuera.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
            - kyverno
            - falco
            - monitoring
            - ingress-nginx
  variables:
    - name: containers
      expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([]) + object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.containers.all(c, c.?securityContext.?allowPrivilegeEscalation.orValue(true) == false)
      message: "Cada contenedor debe declarar securityContext.allowPrivilegeEscalation: false."
    - expression: >-
        variables.containers.all(c, c.?securityContext.?privileged.orValue(false) == false)
      message: "No se permiten contenedores privileged."
