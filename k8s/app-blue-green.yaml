apiVersion: apps/v1
kind: Deployment
metadata:
  name: journal-blue
  namespace: journal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: journal
      color: blue
  template:
    metadata:
      labels:
        app: journal
        color: blue
        version: v1
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: journal:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: APP_VERSION
              value: v1
            - name: DEPLOYMENT_COLOR
              value: blue
          envFrom:
            - secretRef:
                name: journal-secret
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 4
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: journal-green
  namespace: journal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: journal
      color: green
  template:
    metadata:
      labels:
        app: journal
        color: green
        version: v2
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: journal:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: APP_VERSION
              value: v2
            - name: DEPLOYMENT_COLOR
              value: green
          envFrom:
            - secretRef:
                name: journal-secret
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 4
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: journal
  namespace: journal
spec:
  selector:
    app: journal
    color: blue
  ports:
    - name: http
      port: 80
      targetPort: 8000
  type: NodePort

